<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farewell & Best Wishes, Saket!</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary: #fdfbf7;
      --bg-surface: rgba(255, 255, 255, 0.92);
      --gold-primary: #d4af37;
      --gold-dark: #b38b22;
      --gold-light: #f6e6b4;
      --gold-gradient: linear-gradient(135deg, #d4af37 0%, #f6e6b4 50%, #aa7c11 100%);
      --gold-border: rgba(212, 175, 55, 0.35);
      --gold-glow: rgba(212, 175, 55, 0.18);
      --text-dark: #23201a;
      --text-muted: #6e6b63;
      --shadow-soft: 0 10px 30px rgba(180, 150, 80, 0.08);
      --shadow-hover: 0 15px 35px rgba(180, 150, 80, 0.18);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-dark);
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
      line-height: 1.6;
    }

    /* Dynamic Canvas Background (Golden Shimmer / Particles) */
    #particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* HEADER / HERO */
    header {
      padding: 90px 20px 50px;
      text-align: center;
      position: relative;
    }

    .badge {
      display: inline-block;
      padding: 6px 18px;
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid var(--gold-border);
      border-radius: 50px;
      color: var(--gold-dark);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 20px;
      animation: fadeInDown 0.8s ease-out;
    }

    h1.hero-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.8rem, 6vw, 4.8rem);
      font-weight: 700;
      line-height: 1.15;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
      animation: fadeInUp 1s ease-out;
    }

    p.hero-subtitle {
      font-size: clamp(1.05rem, 2vw, 1.25rem);
      color: var(--text-muted);
      max-width: 650px;
      margin: 0 auto;
      font-weight: 300;
      animation: fadeInUp 1.2s ease-out;
    }

    /* SECTION STYLING */
    section {
      padding: 60px 0;
    }

    .section-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .section-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.3rem;
      font-weight: 700;
      color: var(--text-dark);
      position: relative;
      display: inline-block;
      padding-bottom: 12px;
    }

    .section-title::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 2px;
      background: var(--gold-gradient);
      border-radius: 2px;
    }

    /* GLASS CARD SYSTEM */
    .card-panel {
      background: var(--bg-surface);
      border: 1px solid var(--gold-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(10px);
      padding: 35px;
      transition: all 0.3s ease;
    }

    /* GALLERY SECTION */
    .upload-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px dashed var(--gold-border);
      background: rgba(255, 255, 255, 0.6);
      border-radius: var(--radius);
      padding: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 30px;
      text-align: center;
    }

    .upload-area:hover {
      border-color: var(--gold-primary);
      background: rgba(212, 175, 55, 0.04);
      transform: translateY(-2px);
    }

    .upload-icon {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
      fill: var(--gold-primary);
    }

    .file-input {
      display: none;
    }

    /* SCROLLING GALLERY CAROUSEL */
    .gallery-container {
      position: relative;
      overflow: hidden;
      padding: 10px 0;
    }

    .gallery-scroll-wrapper {
      display: flex;
      gap: 24px;
      overflow-x: auto;
      padding: 15px 5px 25px;
      scroll-snap-type: x mandatory;
      scrollbar-width: thin;
      scrollbar-color: var(--gold-primary) #f0ede6;
    }

    .gallery-scroll-wrapper::-webkit-scrollbar {
      height: 8px;
    }

    .gallery-scroll-wrapper::-webkit-scrollbar-thumb {
      background: var(--gold-primary);
      border-radius: 10px;
    }

    .gallery-scroll-wrapper::-webkit-scrollbar-track {
      background: #eee8db;
      border-radius: 10px;
    }

    .photo-card {
      flex: 0 0 280px;
      height: 340px;
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      scroll-snap-align: start;
      background: #ffffff;
      border: 1px solid var(--gold-border);
      box-shadow: var(--shadow-soft);
      transition: all 0.35s ease;
    }

    .photo-card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: var(--shadow-hover);
      border-color: var(--gold-primary);
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo-delete-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--gold-border);
      color: #b03a2e;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: all 0.25s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .photo-card:hover .photo-delete-btn {
      opacity: 1;
    }

    .photo-delete-btn:hover {
      background: #b03a2e;
      color: #fff;
      transform: scale(1.1);
    }

    .empty-placeholder {
      width: 100%;
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-style: italic;
    }

    /* MESSAGES / WISHES BOARD */
    .message-form-wrapper {
      max-width: 650px;
      margin: 0 auto 40px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-dark);
    }

    .form-control {
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid #e0d8c7;
      background: #ffffff;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text-dark);
      transition: all 0.3s ease;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--gold-primary);
      box-shadow: 0 0 0 4px var(--gold-glow);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 110px;
    }

    .btn-gold {
      background: var(--gold-gradient);
      color: #1a1505;
      font-weight: 600;
      border: none;
      padding: 14px 32px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
    }

    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(212, 175, 55, 0.45);
      filter: brightness(1.03);
    }

    /* MESSAGE CARDS GRID */
    .messages-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 24px;
    }

    .message-card {
      background: #ffffff;
      border: 1px solid var(--gold-border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow-soft);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      animation: scaleUp 0.4s ease-out;
    }

    .message-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-hover);
      border-color: var(--gold-primary);
    }

    .message-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--gold-gradient);
      color: #2b2207;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      box-shadow: 0 4px 10px rgba(212, 175, 55, 0.2);
    }

    .author-info h4 {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-dark);
    }

    .author-info span {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .message-body {
      font-size: 0.95rem;
      color: #4a4740;
      white-space: pre-wrap;
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .message-footer {
      display: flex;
      justify-content: flex-end;
      border-top: 1px solid rgba(212, 175, 55, 0.15);
      padding-top: 12px;
    }

    .btn-delete-msg {
      background: none;
      border: none;
      color: #b5493d;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .btn-delete-msg:hover {
      background: rgba(181, 73, 61, 0.08);
    }

    /* FOOTER & ANIMATED THANK YOU NOTE */
    footer {
      padding: 100px 20px 80px;
      text-align: center;
      position: relative;
    }

    .thank-you-box {
      max-width: 750px;
      margin: 0 auto;
      padding: 50px 30px;
      background: radial-gradient(circle at center, rgba(255, 255, 255, 0.95) 0%, rgba(253, 248, 237, 0.8) 100%);
      border: 2px solid var(--gold-border);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(212, 175, 55, 0.15);
      position: relative;
      overflow: hidden;
    }

    .animated-thankyou {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.5rem, 5vw, 4.2rem);
      font-weight: 700;
      background: linear-gradient(90deg, #aa7c11, #d4af37, #f6e6b4, #d4af37, #aa7c11);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: goldShine 4s linear infinite, floatSlow 3s ease-in-out infinite;
      margin-bottom: 15px;
    }

    .thankyou-sub {
      font-size: 1.15rem;
      color: var(--text-muted);
      font-weight: 400;
      max-width: 550px;
      margin: 0 auto;
    }

    .sparkle-icon {
      display: inline-block;
      color: var(--gold-primary);
      animation: spinSlow 8s linear infinite;
    }

    /* KEYFRAME ANIMATIONS */
    @keyframes goldShine {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes spinSlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes scaleUp {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }
