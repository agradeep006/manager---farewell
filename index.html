<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farewell, Saket Kumar!</title>
  <style>
    :root {
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --gold-dark: #aa7c11;
      --black: #0d0d0d;
      --card-bg: #1a1a1a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--black);
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    canvas#confetti {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
      position: relative;
      z-index: 10;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 2.8rem;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
      margin-bottom: 10px;
    }

    p.subtitle {
      font-size: 1.2rem;
      color: var(--gold-light);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--gold);
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 30px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--gold-light);
      font-weight: 600;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 12px;
      background: #111;
      border: 1px solid #444;
      border-radius: 6px;
      color: #fff;
      font-size: 1rem;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: var(--gold);
      outline: none;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: var(--black);
    }

    .btn-secondary {
      background: #2a2a2a;
      color: var(--gold-light);
      border: 1px solid var(--gold);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
    }

    .messages-section h2 {
      color: var(--gold);
      margin-bottom: 15px;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
    }

    .message-item {
      background: #111;
      border-left: 4px solid var(--gold);
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 12px;
    }

    .message-item h4 {
      color: var(--gold-light);
      margin-bottom: 5px;
    }

    .message-item p {
      color: #ddd;
      line-height: 1.4;
    }

    .message-item audio {
      margin-top: 10px;
      width: 100%;
      height: 35px;
    }

    #recordStatus {
      font-size: 0.9rem;
      color: #ff6b6b;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <canvas id="confetti"></canvas>

  <div class="container">
    <header>
      <h1>Farewell, Saket Kumar!</h1>
      <p class="subtitle">Thank you for your leadership, mentorship, and inspiration.</p>
    </header>

    <div class="card">
      <div class="form-group">
        <label for="senderName">Your Name</label>
        <input type="text" id="senderName" placeholder="Enter your full name" />
      </div>

      <div class="form-group">
        <label for="senderMsg">Your Message</label>
        <textarea id="senderMsg" rows="3" placeholder="Write your farewell wishes..."></textarea>
      </div>

      <div class="form-group">
        <label>Or Record a Voice Note</label>
        <div class="btn-row">
          <button type="button" class="btn-secondary" id="recordBtn">Start Recording</button>
          <button type="button" class="btn-secondary" id="stopBtn" disabled>Stop</button>
        </div>
        <p id="recordStatus"></p>
        <audio id="audioPreview" controls style="display:none; margin-top:10px;"></audio>
      </div>

      <div class="btn-row">
        <button class="btn-primary" id="submitBtn">Post Farewell Wish</button>
      </div>
    </div>

    <div class="messages-section">
      <h2>Team Messages & Memories</h2>
      <div id="messagesList"></div>
    </div>
  </div>

  <script>
    // Audio Synthesis for Confetti Crackle
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playCrackleSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const bufferSize = audioCtx.sampleRate * 0.08;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 1200 + Math.random() * 1000;
      filter.Q.value = 3;

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start();
    }

    // Canvas Confetti
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    let particles = [];
    const colors = ['#d4af37', '#f3e5ab', '#aa7c11', '#ffffff', '#ffd700'];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = -20;
        this.size = Math.random() * 8 + 4;
        this.speedY = Math.random() * 2.5 + 1.5;
        this.speedX = Math.random() * 2 - 1;
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.rotation = Math.random() * 360;
        this.rotSpeed = Math.random() * 4 - 2;
      }
      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        this.rotation += this.rotSpeed;
        if (this.y > canvas.height) this.reset();
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.fillStyle = this.color;
        ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size / 2);
        ctx.restore();
      }
    }

    for (let i = 0; i < 70; i++) {
      particles.push(new Particle());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p) => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animate);
    }
    animate();

    // Trigger crackle periodically on user interaction
    document.body.addEventListener('click', () => {
      playCrackleSound();
    }, { once: false });

    // Voice Recorder Handling
    let mediaRecorder;
    let audioChunks = [];
    let audioBlob = null;

    const recordBtn = document.getElementById('recordBtn');
    const stopBtn = document.getElementById('stopBtn');
    const recordStatus = document.getElementById('recordStatus');
    const audioPreview = document.getElementById('audioPreview');

    recordBtn.onclick = async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
        mediaRecorder.onstop = () => {
          audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          audioPreview.src = URL.createObjectURL(audioBlob);
          audioPreview.style.display = 'block';
          recordStatus.textContent = 'Voice note recorded successfully!';
        };

        mediaRecorder.start();
        recordBtn.disabled = true;
        stopBtn.disabled = false;
        recordStatus.textContent = 'Recording in progress...';
      } catch (err) {
        recordStatus.textContent = 'Microphone access denied or not supported.';
      }
    };

    stopBtn.onclick = () => {
      mediaRecorder.stop();
      recordBtn.disabled = false;
      stopBtn.disabled = true;
    };

    // Message Submission
    const submitBtn = document.getElementById('submitBtn');
    const messagesList = document.getElementById('messagesList');

    submitBtn.onclick = () => {
      const name = document.getElementById('senderName').value.trim();
      const msg = document.getElementById('senderMsg').value.trim();

      if (!name) {
        alert('Please enter your name.');
        return;
      }

      if (!msg && !audioBlob) {
        alert('Please provide either a text message or a voice note.');
        return;
      }

      playCrackleSound();

      const item = document.createElement('div');
      item.className = 'message-item';

      let html = `<h4>${name}</h4>`;
      if (msg) html += `<p>${msg}</p>`;
      if (audioBlob) {
        const audioUrl = URL.createObjectURL(audioBlob);
        html += `<audio controls src="${audioUrl}"></audio>`;
      }

      item.innerHTML = html;
      messagesList.prepend(item);

      // Reset Form
      document.getElementById('senderName').value = '';
      document.getElementById('senderMsg').value = '';
      audioBlob = null;
      audioPreview.style.display = 'none';
      recordStatus.textContent = '';
    };
  </script>
</body>
</html>
